name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Three points across the supported range rather than every version.
      # 3.10 is the floor the code actually needs (`X | None` in annotations)
      # and it goes end-of-life in October 2026 — when it does, it comes out
      # of this list rather than getting pinned around.
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -q

      # O README diz quantos testes ha, em quatro sitios. Nenhum deles estava a
      # ser re-medido, e os quatro ficaram para tras quando a suite cresceu.
      # Um numero em prosa e uma medicao sem instrumento; este e o instrumento.
      - name: O README ainda diz o numero certo de testes
        run: python3 tools/contagem.py

      # The shipped expenses.csv holds one row in the FIRST version's format —
      # three columns, an emoji category, no date. It is there on purpose so
      # that anyone who clones this exercises the migration path on their first
      # run. The tests all use tmp_path, so if normalise_category ever stopped
      # recognising that row the suite would stay green while the program
      # silently dropped it.
      - name: The shipped ledger still reads
        run: |
          saida=$(printf '\n' | python expense_tracker.py --all --summary)
          echo "$saida"
          echo "$saida" | grep -q "25.00 EUR" || {
            echo "::error::a linha de exemplo em expenses.csv deixou de ser lida"
            exit 1
          }

      # The summary defaults to the current month. Before that default existed
      # it summed the whole file and divided by today's date, which is right
      # for exactly as long as the file holds one month. This asserts the
      # window is real: an undated row must NOT appear in a month.
      - name: The month window is a real window
        run: |
          saida=$(printf '\n' | python expense_tracker.py --summary)
          echo "$saida"
          echo "$saida" | grep -q "Nothing recorded in" || {
            echo "::error::a linha sem data entrou num mês onde não devia estar"
            exit 1
          }
          echo "$saida" | grep -q -- "--all" || {
            echo "::error::um beco sem saída não é uma resposta: falta apontar o --all"
            exit 1
          }
